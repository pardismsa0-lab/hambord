<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="هم‌برد — پلتفرم خرید جمعی هوشمند؛ کمپین‌های پله‌ای، تأمین‌کننده‌های تأییدشده و صرفه‌جویی واقعی" />
    <title>هم‌برد | خرید جمعی هوشمند</title>

    <!-- فونت‌های فارسی -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
      }
      body {
        background-color: #f4f6f9;
        color: #122338;
      }
      #root:empty::after {
        content: "در حال بارگذاری هم‌برد…";
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        font-family: "Vazirmatn", Tahoma, sans-serif;
        font-size: 15px;
        font-weight: 700;
        color: #1a4b8c;
        letter-spacing: 0.05em;
      }
    </style>

    <script>
      (function () {
        if (window.self === window.top) return;
        var reported = {};
        window.addEventListener("error", function (event) {
          if (!event || !event.message) return;
          var key =
            event.message + "|" + (event.filename || "") + "|" + (event.lineno || 0);
          if (reported[key]) return;
          reported[key] = true;
          try {
            window.parent.postMessage(
              {
                type: "sandbox-runtime-error",
                payload: {
                  message: String(event.message).slice(0, 500),
                  filename: event.filename || "",
                  lineno: event.lineno || 0,
                  colno: event.colno || 0,
                  stack:
                    event.error && event.error.stack
                      ? String(event.error.stack).slice(0, 2000)
                      : ""
                }
              },
              "*"
            );
          } catch (e) {
            /* ignore */
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
